[tool.poetry]
name = "unlisted"
version = "0.1.4"
description = "Find a YouTube channel's unlisted videos"
authors = ["ramsy0dev"]
license = "GPL v3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
typer = ">=0.20.1,<0.28.0"
requests = "^2.32.3"
rich = "^14.3.3"
user-agent = "^0.1.10"
py-proxy = "^0.2.6"
pyt = {git = "https://github.com/thefr0gg/pyt", tag = "v2.1.0"}


[tool.poetry.scripts]
unlisted = "unlisted.cli:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
