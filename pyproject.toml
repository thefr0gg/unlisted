[tool.poetry]
name = "unlisted"
version = "0.1.4"
description = "Find a YouTube channel's unlisted videos"
authors = ["thefr0gg"]
license = "GPL v3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
requests = "^2.32.3"
rich = "^14.3.3"
user-agent = "^0.1.10"
pytube = {git = "https://github.com/ramsy0dev/pytube"}


[tool.poetry.plugins."console_scripts"]
unlisted = "unlisted:cli.run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
